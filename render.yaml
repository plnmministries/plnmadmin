# Render Blueprint for the admin app (editor). Free plan: no disk needed, because all content,
# photos and the login are stored in the Neon database (DATABASE_URL).
# Render → New → Blueprint → pick this repo. You'll be asked for ADMIN_PASSWORD, DATABASE_URL and SITE_URL.
services:
  - type: web
    name: plnmadmin
    runtime: node
    region: singapore # closest Render region to Hyderabad
    plan: free # sleeps after 15 min idle; first visit to the editor then takes ~1 min. The public site is unaffected.
    buildCommand: npm ci && npm run build
    startCommand: npm start -- -H 0.0.0.0
    healthCheckPath: /admin/login
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false # you type it during setup; change it later inside the editor
      - key: DATABASE_URL
        sync: false # Neon connection string (same one the Vercel website uses)
      - key: SESSION_SECRET
        generateValue: true
      - key: REVALIDATE_SECRET
        generateValue: true # copy this value into the Vercel project too
      - key: SITE_URL
        sync: false # the Vercel website address, e.g. https://plnm.vercel.app
